<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter</title>

    <!-- CSS link -->
    <link rel="stylesheet" href="style.css">

    <!-- icon link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
    
</head>

<body>
    
    <!-- Card -->
    <div class="card">

        <!-- Card header -->
        <div class="card-header">
            <h1>Counter</h1>
        </div>
        
        <!-- Card body -->
        <div class="card-body">
            <h1 id="count">0</h1>
        </div>

        <!-- Card footer -->
        <div class="card-footer">
            <button id="decrease" class="btn btn-decrease">Decrease</button>
            <button id="reset" class="btn btn-reset">Reset</button>
            <button id="increase" class="btn btn-increase">Increase</button>
        </div>
        
    </div>
    
    <!-- javascript link -->
    <script src="script.js"></script>
</body>

</html>
