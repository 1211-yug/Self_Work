<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Flip Card</title>
    
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="card-container" id="myCard" onclick="flipCard()">
        <div class="card-inner">
            <div class="card-front">
                <h2>VIP MEMBER</h2>
                <div class="chip"></div>
                <h3>1639 5323 9322 6824</h3>
                <p>YUG PATEL</p>
            </div>
            <div class="card-back">
                <div class="magnetic-strip"></div>
                <div class="signature">
                    <span>CVV 121</span>
                </div>
            </div>
        </div>
    </div>
    
    <p class="hint">Click the card to flip it!</p>
    
    <script src="script.js"></script>
    
</body>
</html>
